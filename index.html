<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mdrn Quest - Alpha</title>
    <style>
        /* FIX: Ensure this matches your file case exactly */
        @font-face { 
            font-family: 'Medieval'; 
            src: url('./blackletter.TTF') format('truetype'); 
        }

        @font-face {
            font-family: 'HelveticaBold';
            src: url('./helveticabold.ttf') format('truetype');
        }

        .hud-btn {
            font-family: 'HelveticaBold', sans-serif;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 2px solid #555;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 1px 1px 3px #000;
        }
        .hud-btn:active { background: rgba(50, 50, 50, 0.8); }

        html, body { 
            font-family: 'HelveticaBold', sans-serif;
            margin: 0; 
            overflow: hidden; 
            background-color: #111; 
            
            overscroll-behavior: none;

            /* --- MOBILE TOUCH FIXES --- */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none; 

            /* 1. The closest CSS equivalent to Optical Kerning */
            text-rendering: optimizeLegibility;
            font-kerning: normal;
            font-feature-settings: "kern" 1;
            
            /* 2. Tracking set to -25 */
            letter-spacing: -0.025em;
        }

        canvas { display: block; }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            user-select: none;
            pointer-events: none;
            text-shadow: 4px 4px 5px #000;
            z-index: 100;
        }

        h1 {
            font-family: 'Medieval', serif;
            margin: 0;
            font-size: 60px; 
            line-height: 0.8;
            font-weight: normal;
            letter-spacing: 2px;
        }

        p.score-text {
            font-family: 'Medieval', serif;
            font-size: 30px;
            margin: 10px 0;
        }

        p.instructions {
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 18px; 
            font-weight: bold;
            opacity: 0.8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px #000;
        }

        .highlight { color: #ffff00; }
        .danger { color: #ff3333; }

        #pause-screen {
            display: none;
            flex-direction: column; /* Stacks the content vertically */
            align-items: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Medieval', serif;
            font-size: 100px;
            color: white;
            text-shadow: 5px 5px 8px #000;
            z-index: 200;
        }

        /* DEBUG BUTTONS -> UPGRADED TO MENU BUTTONS */
        .debug-btn {
            background: rgba(30, 30, 30, 0.9); 
            color: white; 
            border: 2px solid #555;
            padding: 15px 30px; 
            margin-bottom: 15px; 
            cursor: pointer;
            font-family: 'HelveticaBold', 'Helvetica', Arial, sans-serif; 
            font-size: 16px; 
            font-weight: bold;
            display: block; 
            width: 250px; /* Wider for mobile tapping */
            border-radius: 8px;
            text-transform: uppercase;
            text-shadow: 1px 1px 3px #000;
            transition: 0.1s;
        }
        .debug-btn:active { 
            background: rgba(80, 80, 80, 0.9); 
            border-color: #00ff00; 
        }

        #game-over {
            display: none; 
            font-family: 'Medieval', serif; 
            font-size: 80px; 
            color: #ff3333; 
            margin-top: 20px;
            text-shadow: 4px 4px 5px #000;
        }

        /* --- ZONE WARNING --- */
        #zone-warning {
            display: none;
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            font-family: 'Helvetica', sans-serif;
            font-size: 24px;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
            letter-spacing: 4px;
            z-index: 150;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1.0; transform: scale(1.1); }
            100% { opacity: 0.5; }
        }

        /* --- MOBILE CONTROLS --- */
        
        /* Joystick Zone (LEFT SIDE) */
        #zone_joystick {
            position: absolute;
            bottom: 40px;
            left: 40px;     
            width: 150px;
            height: 150px;
            z-index: 150;
        }

        /* Jump Button (RIGHT SIDE) */
        #mobile-jump {
            position: absolute;
            bottom: 40px;
            right: 40px;    
            width: 90px;
            height: 90px;
            background: rgba(50, 205, 50, 0.3);
            border: 4px solid #32CD32;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Helvetica', sans-serif;
            font-weight: bold;
            font-size: 18px;
            z-index: 150;
            text-shadow: 1px 1px 4px #000;
            user-select: none;
            -webkit-user-select: none;
        }
        
        #mobile-jump:active {
            background: rgba(50, 205, 50, 0.6);
            transform: scale(0.95);
        }

    

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</head>
<body>
    
    <div id="ui-container">
        <p class="score-text" style="font-size: 20px; margin-bottom: 5px;">Deliveries: <span id="score" class="highlight">0</span></p>
        <p class="score-text" style="font-size: 18px; margin-top: 0; opacity: 0.9;">Time Left: <span id="timer" class="highlight">60.0</span>s</p>

        <div id="status-panel" style="margin-top: 10px; font-family: 'HelveticaBold', sans-serif; font-size: 14px;">
            <div id="status-bike" style="color: #32CD32; display: none; text-shadow: 2px 2px 4px #000;">
                [ LIME BIKE ACTIVE ]
            </div>
            <div id="status-drink" style="color: #00FFFF; display: none; text-shadow: 2px 2px 4px #000;">
                ENERGY: <span id="drink-timer">0.0</span>s
            </div>
        </div>
        
        <div style="margin-top: 15px; display: flex; gap: 10px; pointer-events: auto;">
            <button id="btn-map" class="hud-btn">MAP (M)</button>
            <button id="btn-pause" class="hud-btn">PAUSE (P)</button>
        </div>

        <div id="game-over">SHIFT ENDED</div>
    </div>
    
    <div id="zone-warning">⚠️ LEAVING SAFE ZONE ⚠️</div>

    <div id="zone_joystick"></div>
    <div id="mobile-jump">JUMP</div>
    
    <div id="pause-screen">
        <div style="margin-bottom: 30px;">PAUSED</div>
        <button class="debug-btn" onclick="window.switchMap()">SWITCH MAP</button>
        <button class="debug-btn" onclick="window.debugSpawn('bike')">SPAWN BIKE</button>
        <button class="debug-btn" onclick="window.debugSpawn('drink')">SPAWN DRINK</button>
        
        <button class="debug-btn" onclick="window.debugSpawn('armor_tee')">SPAWN T-SHIRT</button>
        <button class="debug-btn" onclick="window.debugSpawn('armor_belt')">SPAWN BELT</button>
        
        <button class="debug-btn" onclick="window.spawnPolice()">SPAWN POLICE</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.7.0/build/index.module.js"
            }
        }
    </script>
    <script type="module" src="./game.js"></script>
</body>
</html>
