<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mdrn Quest - Alpha</title>
    <style>
        /* FIX: Ensure this matches your file case exactly */
        @font-face { 
            font-family: 'Medieval'; 
            src: url('./blackletter.TTF') format('truetype'); 
        }

        @font-face {
            font-family: 'HelveticaBold';
            src: url('./helveticabold.ttf') format('truetype');
        }

        .hud-btn {
            font-family: 'HelveticaBold', sans-serif;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 2px solid #555;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 1px 1px 3px #000;
        }
        .hud-btn:active { background: rgba(50, 50, 50, 0.8); }

        html, body { 
            font-family: 'HelveticaBold', sans-serif;
            margin: 0; 
            overflow: hidden; 
            background-color: #111; 
            
            overscroll-behavior: none;

            /* --- MOBILE TOUCH FIXES --- */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none; 

            /* 1. The closest CSS equivalent to Optical Kerning */
            text-rendering: optimizeLegibility;
            font-kerning: normal;
            font-feature-settings: "kern" 1;
            
            /* 2. Tracking set to -25 */
            letter-spacing: -0.025em;
        }

        canvas { display: block; }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            user-select: none;
            pointer-events: none;
            text-shadow: 4px 4px 5px #000;
            z-index: 100;
        }

        h1 {
            font-family: 'Medieval', serif;
            margin: 0;
            font-size: 60px; 
            line-height: 0.8;
            font-weight: normal;
            letter-spacing: 2px;
        }

        p.score-text {
            font-family: 'Medieval', serif;
            font-size: 30px;
            margin: 10px 0;
        }

        p.instructions {
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 18px; 
            font-weight: bold;
            opacity: 0.8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px #000;
        }

        .highlight { color: #ffff00; }
        .danger { color: #ff3333; }

        #pause-screen {
            display: none;
            flex-direction: column; /* Stacks the content vertically */
            align-items: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Medieval', serif;
            font-size: 100px;
            color: white;
            text-shadow: 5px 5px 8px #000;
            z-index: 200;
        }

        /* DEBUG BUTTONS -> UPGRADED TO MENU BUTTONS */
        .debug-btn {
            background: rgba(30, 30, 30, 0.9); 
            color: white; 
            border: 2px solid #555;
            padding: 15px 30px; 
            margin-bottom: 15px; 
            cursor: pointer;
            font-family: 'HelveticaBold', 'Helvetica', Arial, sans-serif; 
            font-size: 16px; 
            font-weight: bold;
            display: block; 
            width: 250px; /* Wider for mobile tapping */
            border-radius: 8px;
            text-transform: uppercase;
            text-shadow: 1px 1px 3px #000;
            transition: 0.1s;
        }
        .debug-btn:active { 
            background: rgba(80, 80, 80, 0.9); 
            border-color: #00ff00; 
        }

        #game-over {
            display: none; 
            font-family: 'Medieval', serif; 
            font-size: 80px; 
            color: #ff3333; 
            margin-top: 20px;
            text-shadow: 4px 4px 5px #000;
        }

        /* --- ZONE WARNING --- */
        #zone-warning {
            display: none;
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            font-family: 'Helvetica', sans-serif;
            font-size: 24px;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
            letter-spacing: 4px;
            z-index: 150;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1.0; transform: scale(1.1); }
            100% { opacity: 0.5; }
        }

        /* --- MOBILE CONTROLS --- */
        
        /* --- CONTROLLER OVERLAY --- */
        #controller-overlay {
            position: fixed;
            bottom: -1px; 
            left: 50%;
            transform: translateX(-50%);
            width: 95vw;         
            max-width: 700px;    /* Tweak this if you want it bigger/smaller on PC */
            
            /* EXACT Aspect Ratio from your Photoshop file! */
            aspect-ratio: 10677 / 7476; 
            
            background: url('basecontroller.png') center / contain no-repeat;
            z-index: 100;
            pointer-events: none; 
        }

        /* --- JOYSTICK ZONE --- */
        #zone_joystick {
            position: absolute;
            /* Top-Left coordinates of the Joystick Base */
            top: 14.95%;  /* 1193 / 7476 */
            left: 9.25%;  /* 988 / 10677 */
            
            /* Tweak this width until the NippleJS base matches your background base */
            width: 22%; 
            aspect-ratio: 1 / 1; /* Keeps the touch zone perfectly square */
            pointer-events: auto; 
        }
        
        .nipple .back {
            background: url('joystick_base.png') center/contain no-repeat !important;
            background-color: transparent !important;
            border: none !important;
            opacity: 1 !important; 
        }
        .nipple .front {
            background: url('joystick_knob.png') center/contain no-repeat !important;
            background-color: transparent !important;
            border: none !important;
            opacity: 1 !important;
        }

        /* --- ACTION BUTTONS ZONE --- */
        #action-pad {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; 
        }

        .action-btn {
            position: absolute;
            /* Tweak this ONE width to scale all 4 buttons up or down simultaneously */
            width: 8%; 
            height: auto;
            pointer-events: auto; 
            transition: opacity 0.05s ease; 
            /* NOTICE: We removed the translate(-50%, -50%) here! */
        }

        /* --- EXACT PHOTOSHOP PERCENTAGES --- */
        #btn-triangle { top: 13.41%; left: 74.20%; }
        #btn-square   { top: 24.37%; left: 65.77%; }
        #btn-circle   { top: 23.71%; left: 83.44%; }
        #btn-x        { top: 34.48%; left: 74.73%; }

        /* --- MENU BUTTONS --- */
        .menu-btn {
            position: absolute;
            /* Tweak this width until they fit perfectly in the slots */
            width: 5%; 
            height: auto;
            pointer-events: auto; 
            transition: opacity 0.05s ease; 
        }

        #btn-select { top: 37.28%; left: 40.54%; }
        #btn-start  { top: 36.66%; left: 52.87%; }

        @media (orientation: landscape) and (min-width: 600px) {
            #controller-overlay {
                width: 38vw;
                max-width: 320px;
            }
        }

        @media (min-width: 1024px) {
            #controller-overlay {
                width: 28vw;
                max-width: 280px;
            }
        }

        /* Jump Button (RIGHT SIDE) */
        #mobile-jump {
            position: absolute;
            bottom: 40px;
            right: 40px;    
            width: 90px;
            height: 90px;
            background: rgba(50, 205, 50, 0.3);
            border: 4px solid #32CD32;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Helvetica', sans-serif;
            font-weight: bold;
            font-size: 18px;
            z-index: 150;
            text-shadow: 1px 1px 4px #000;
            user-select: none;
            -webkit-user-select: none;
        }
        
        #mobile-jump:active {
            background: rgba(50, 205, 50, 0.6);
            transform: scale(0.95);
        }

    

    </style>
    <script>
    (function(){
    const LOG_KEY = 'mq_crashlog';
    const HEARTBEAT_KEY = 'mq_heartbeat';

    function readLog(){
        try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); }
        catch(e){ return []; }
    }
    function writeLog(arr){
        try { localStorage.setItem(LOG_KEY, JSON.stringify(arr.slice(-80))); } catch(e){}
    }
    function log(type, data){
        const arr = readLog();
        arr.push({ t: Date.now(), iso: new Date().toISOString(), type, data });
        writeLog(arr);
    }
    // Let game.js push renderer stats into the same crash log, so the on-screen
    // badge shows GPU texture/geometry counts from the run that died.
    window.mqLog = log;

    // ---- Detect "silent reload" on startup ----
    // If a heartbeat was written less than 5s ago AND we're freshly executing top-level code,
    // the tab was almost certainly killed and reloaded by iOS.
    try {
        const lastBeat = parseInt(localStorage.getItem(HEARTBEAT_KEY) || '0', 10);
        const gap = Date.now() - lastBeat;
        if (lastBeat && gap < 8000) {
        log('SILENT_RELOAD_DETECTED', {
            msSinceLastHeartbeat: gap,
            memory: performance.memory ? {
            used: performance.memory.usedJSHeapSize,
            total: performance.memory.totalJSHeapSize,
            limit: performance.memory.jsHeapSizeLimit
            } : 'unavailable'
        });
        } else if (lastBeat) {
        log('NORMAL_LOAD', { msSinceLastHeartbeat: gap });
        } else {
        log('FIRST_LOAD', {});
        }
    } catch(e){}

    // ---- Heartbeat: pulse every 1s so we know the last moment we were alive ----
    setInterval(() => {
        try { localStorage.setItem(HEARTBEAT_KEY, String(Date.now())); } catch(e){}
    }, 1000);

    // ---- JS error catchers ----
    window.addEventListener('error', (e) => {
        log('JS_ERROR', {
        msg: e.message,
        file: e.filename,
        line: e.lineno,
        col: e.colno,
        stack: e.error && e.error.stack ? String(e.error.stack).slice(0, 500) : null
        });
    });
    window.addEventListener('unhandledrejection', (e) => {
        log('UNHANDLED_REJECTION', {
        reason: (e.reason && e.reason.message) || String(e.reason).slice(0, 500)
        });
    });

    // ---- Lifecycle events ----
    window.addEventListener('pagehide', (e) => {
        log('PAGEHIDE', { persisted: e.persisted });
    });
    window.addEventListener('beforeunload', () => {
        log('BEFOREUNLOAD', {});
    });
    document.addEventListener('visibilitychange', () => {
        log('VISIBILITY', { state: document.visibilityState });
    });

    // ---- WebGL context loss (the strongest single signal of GPU memory pressure on iOS) ----
    // We can't attach this until the canvas exists, so poll briefly.
    const tryAttachGL = () => {
        const c = document.querySelector('canvas');
        if (!c) return false;
        c.addEventListener('webglcontextlost', (e) => {
        log('WEBGL_CONTEXT_LOST', { defaultPrevented: e.defaultPrevented });
        }, false);
        c.addEventListener('webglcontextrestored', () => {
        log('WEBGL_CONTEXT_RESTORED', {});
        }, false);
        return true;
    };
    let glTries = 0;
    const glInterval = setInterval(() => {
        if (tryAttachGL() || ++glTries > 50) clearInterval(glInterval);
    }, 200);

    // ---- Periodic memory sample (Safari does NOT expose performance.memory, but log if available) ----
    setInterval(() => {
        if (performance.memory) {
        log('MEM', {
            used: performance.memory.usedJSHeapSize,
            total: performance.memory.totalJSHeapSize
        });
        }
    }, 5000);

    // ---- On-screen viewer for the previous session's log ----
    // Tap the small badge in the top-right to expand. Long-press to clear.
    function buildViewer(){
        const arr = readLog();
        if (!arr.length) return;
        const badge = document.createElement('div');
        badge.textContent = '🐛 ' + arr.length;
        badge.style.cssText = `
        position:fixed; top:8px; right:8px; z-index:99999;
        background:#000; color:#0f0; font:12px/1 monospace;
        padding:6px 8px; border:1px solid #0f0; border-radius:4px;
        pointer-events:auto;
        `;
        const panel = document.createElement('pre');
        panel.style.cssText = `
        position:fixed; top:36px; right:8px; z-index:99999;
        background:rgba(0,0,0,0.92); color:#0f0;
        font:10px/1.3 monospace; padding:8px;
        max-width:90vw; max-height:70vh; overflow:auto;
        border:1px solid #0f0; border-radius:4px;
        display:none; white-space:pre-wrap; pointer-events:auto;
        `;
        panel.textContent = arr.map(e =>
        e.iso.slice(11,19) + ' ' + e.type + ' ' + JSON.stringify(e.data)
        ).join('\n');

        let pressTimer;
        badge.addEventListener('click', () => {
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        });
        badge.addEventListener('touchstart', () => {
        pressTimer = setTimeout(() => {
            localStorage.removeItem(LOG_KEY);
            badge.remove(); panel.remove();
        }, 1500);
        });
        badge.addEventListener('touchend', () => clearTimeout(pressTimer));

        document.addEventListener('DOMContentLoaded', () => {
        document.body.appendChild(badge);
        document.body.appendChild(panel);
        });
    }
    buildViewer();
    })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</head>
<body>
    
    <div id="ui-container">
        <p class="score-text" style="font-size: 20px; margin-bottom: 5px;">Deliveries: <span id="score" class="highlight">0</span></p>
        <p class="score-text" style="font-size: 18px; margin-top: 0; opacity: 0.9;">Time Left: <span id="timer" class="highlight">60.0</span>s</p>

        <div id="status-panel" style="margin-top: 10px; font-family: 'HelveticaBold', sans-serif; font-size: 14px;">
            <div id="status-bike" style="color: #32CD32; display: none; text-shadow: 2px 2px 4px #000;">
                [ LIME BIKE ACTIVE ]
            </div>
            <div id="status-drink" style="color: #00FFFF; display: none; text-shadow: 2px 2px 4px #000;">
                ENERGY: <span id="drink-timer">0.0</span>s
            </div>
        </div>
        
        <div style="margin-top: 15px; display: flex; gap: 10px; pointer-events: auto;">
            <button id="btn-map" class="hud-btn">MAP (M)</button>
            <button id="btn-pause" class="hud-btn">PAUSE (P)</button>
        </div>

        <div id="game-over">SHIFT ENDED</div>
    </div>
    
    <div id="zone-warning">⚠️ LEAVING SAFE ZONE ⚠️</div>

    <div id="controller-overlay">
        
        <div id="zone_joystick"></div>

        <div id="action-pad">
            <img src="triangleBTN.png" id="btn-triangle" class="action-btn">
            <img src="squareBTN.png" id="btn-square" class="action-btn">
            <img src="circleBTN.png" id="btn-circle" class="action-btn">
            <img src="xBTN.png" id="btn-x" class="action-btn">
            
            <img src="selectBTN.png" id="btn-select" class="menu-btn">
            <img src="startBTN.png" id="btn-start" class="menu-btn">
        </div>
    </div>
    
    <div id="pause-screen">
        <div style="margin-bottom: 30px;">PAUSED</div>

        <button class="debug-btn" onclick="document.getElementById('btn-pause').click()">RESUME GAME</button>
        
        <button class="debug-btn" onclick="window.switchMap()">SWITCH MAP</button>
        <button class="debug-btn" onclick="window.debugSpawn('bike')">SPAWN BIKE</button>
        <button class="debug-btn" onclick="window.debugSpawn('drink')">SPAWN DRINK</button>
        
        <button class="debug-btn" onclick="window.debugSpawn('armor_tee')">SPAWN T-SHIRT</button>
        <button class="debug-btn" onclick="window.debugSpawn('armor_belt')">SPAWN BELT</button>
        
        <button class="debug-btn" onclick="window.spawnPolice()">SPAWN POLICE</button>
        <button class="debug-btn" onclick="window.toggleStats()">PERF STATS (I)</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.7.0/build/index.module.js"
            }
        }
    </script>
    <script type="module" src="./game.js"></script>
</body>
