<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mdrn Quest - Alpha</title>
    <style>
        /* FIX: Ensure this matches your file case exactly */
        @font-face { 
            font-family: 'Medieval'; 
            src: url('./blackletter.TTF') format('truetype'); 
        }

        @font-face {
            font-family: 'HelveticaBold';
            src: url('./helveticabold.ttf') format('truetype');
        }

        html, body {
            font-family: 'HelveticaBold', sans-serif;
            margin: 0; 
            overflow: hidden; 
            background-color: #111; 
            
            overscroll-behavior: none;

            /* --- MOBILE TOUCH FIXES --- */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none; 

            /* 1. The closest CSS equivalent to Optical Kerning */
            text-rendering: optimizeLegibility;
            font-kerning: normal;
            font-feature-settings: "kern" 1;
            
            /* 2. Tracking set to -25 */
            letter-spacing: -0.025em;
        }

        canvas { display: block; }

        /* --- HUD BAR ---------------------------------------------------------
           One row across the top, values only. Everything that used to be a
           word is now position, colour or shape: first slot is the delivery
           count, centre is the clock, right is condition. The scrim is a
           gradient rather than a filled bar so it disappears into the sky
           instead of cutting a rectangle out of it.
           Note: the local 'HelveticaBold' face is byte-identical to
           blackletter.TTF, so this deliberately uses the system Helvetica. */
        #hud {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px 18px;
            padding-top: max(9px, env(safe-area-inset-top));
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 700;
            font-size: 12px;
            line-height: 1;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum" 1, "kern" 1;
            color: #fff;
            background: linear-gradient(180deg,
                        rgba(0,0,0,0.60) 0%,
                        rgba(0,0,0,0.34) 45%,
                        rgba(0,0,0,0.00) 100%);
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            pointer-events: none;
            user-select: none;
            z-index: 100;
        }

        /* Three equal columns, not "left, stretchy middle, right" — otherwise
           the clock sits at the centre of the leftover space rather than the
           centre of the screen, and drifts every time the score or the wanted
           stars change width. */
        .hud-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 0;
            min-width: 0;
        }
        .hud-group.center { justify-content: center; }
        .hud-group.right  { justify-content: flex-end; }

        .hud-sep {
            width: 1px;
            height: 10px;
            background: rgba(255,255,255,0.30);
        }

        #hud-score { font-size: 15px; letter-spacing: -0.05em; }

        #hud-armor { color: #cfe3ff; display: none; }
        #hud-stars { color: #ffd400; letter-spacing: 0.02em; }

        #hud-timer { font-size: 13px; color: #fff; }
        #hud-timer.danger { color: #ff3b30; animation: hud-blink 0.6s steps(2, start) infinite; }
        @keyframes hud-blink { 50% { opacity: 0.35; } }

        #hud-health {
            width: 68px;
            height: 4px;
            background: rgba(255,255,255,0.20);
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35);
            border-radius: 2px;
            overflow: hidden;
        }
        #hud-health-fill {
            display: block;
            height: 100%;
            width: 100%;
            background: #fff;
            transition: width 0.15s linear, background-color 0.15s linear;
        }

        .hud-pip {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #fff;
            display: none;
            box-shadow: 0 0 6px currentColor;
        }
        #hud-pip-bike  { background: #32CD32; color: #32CD32; }
        #hud-pip-drink { background: #00FFFF; color: #00FFFF; }

        @media (max-width: 600px) {
            #hud { font-size: 10px; gap: 7px; padding: 7px 10px 16px; }
            #hud-score { font-size: 13px; }
            #hud-timer { font-size: 11px; }
            #hud-health { width: 52px; height: 3px; }
        }

        h1 {
            font-family: 'Medieval', serif;
            margin: 0;
            font-size: 60px; 
            line-height: 0.8;
            font-weight: normal;
            letter-spacing: 2px;
        }

        p.score-text {
            font-family: 'Medieval', serif;
            font-size: 30px;
            margin: 10px 0;
        }

        p.instructions {
            font-family: 'Helvetica', 'Arial', sans-serif;
            font-size: 18px; 
            font-weight: bold;
            opacity: 0.8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px #000;
        }

        .highlight { color: #ffff00; }
        .danger { color: #ff3333; }

        #pause-screen {
            display: none;
            flex-direction: column; /* Stacks the content vertically */
            align-items: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Medieval', serif;
            font-size: 100px;
            color: white;
            text-shadow: 5px 5px 8px #000;
            z-index: 200;
        }

        /* DEBUG BUTTONS -> UPGRADED TO MENU BUTTONS */
        .debug-btn {
            background: rgba(30, 30, 30, 0.9); 
            color: white; 
            border: 2px solid #555;
            padding: 15px 30px; 
            margin-bottom: 15px; 
            cursor: pointer;
            font-family: 'HelveticaBold', 'Helvetica', Arial, sans-serif; 
            font-size: 16px; 
            font-weight: bold;
            display: block; 
            width: 250px; /* Wider for mobile tapping */
            border-radius: 8px;
            text-transform: uppercase;
            text-shadow: 1px 1px 3px #000;
            transition: 0.1s;
        }
        .debug-btn:active { 
            background: rgba(80, 80, 80, 0.9); 
            border-color: #00ff00; 
        }

        /* Freed from the old top-left HUD container, so it can centre properly. */
        #game-over {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            font-family: 'Medieval', serif;
            font-size: 80px;
            color: #ff3333;
            text-shadow: 4px 4px 5px #000;
            z-index: 200;
            pointer-events: none;
        }
        #game-over button { pointer-events: auto; }

        /* --- ZONE WARNING --- */
        #zone-warning {
            display: none;
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            font-family: 'Helvetica', sans-serif;
            font-size: 24px;
            font-weight: bold;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
            letter-spacing: 4px;
            z-index: 150;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1.0; transform: scale(1.1); }
            100% { opacity: 0.5; }
        }

        /* --- MOBILE CONTROLS --- */
        
        /* --- CONTROLLER OVERLAY --- */
        #controller-overlay {
            position: fixed;
            bottom: -1px;
            left: 50%;
            /* Pushed a third of its own height off the bottom of the screen.
               Everything interactive — stick, face buttons, select/start — sits
               in the top ~46% of the artwork; the rest is grips and cable. So
               this hands back a third of the panel's screen space for free, and
               puts the controls nearer where thumbs already rest. Percentages
               in translate resolve against the element's own size, so it tracks
               whatever width the media queries below pick. */
            transform: translate(-50%, 34%);
            width: 95vw;
            max-width: 700px;

            /* EXACT Aspect Ratio from your Photoshop file! */
            aspect-ratio: 10677 / 7476;

            background: url('basecontroller.png') center / contain no-repeat;
            z-index: 100;
            pointer-events: none;
        }

        /* Desktop has a keyboard, so the pad is pure clutter there. Keyed on
           input capability rather than screen width: a touchscreen laptop or a
           tablet in landscape is wide but still wants the pad, and a phone held
           sideways is narrow but must never lose it. */
        @media (hover: hover) and (pointer: fine) {
            #controller-overlay { display: none; }
            /* Exactly the devices that just lost the pad are the ones with no
               other way of discovering the controls, so the keyboard map is
               bound to the same query rather than a second, driftable one. */
            #controls-hint { display: flex !important; }
        }

        #controls-hint {
            display: none;
            /* Kept in the flow, under the start card. Floating it against the
               bottom edge instead put it straight through the card on a short
               window — the column is vertically centred, so its height is not
               something a fixed offset can be chosen against. The title screen
               scrolls instead (see its overflow-y), which costs nothing on a
               tall window and degrades gracefully on a short one. */
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px 16px;
            max-width: 460px;
            margin: 24px 0 8px;
            padding: 0 20px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            color: #8e8e8e;
        }
        #controls-hint b {
            display: inline-block;
            min-width: 14px;
            padding: 2px 5px;
            margin-right: 2px;
            border: 1px solid #5a5a5a;
            border-radius: 3px;
            color: #e8e8e8;
            font-weight: 700;
        }

        /* --- JOYSTICK ZONE --- */
        #zone_joystick {
            position: absolute;
            /* Top-Left coordinates of the Joystick Base */
            top: 14.95%;  /* 1193 / 7476 */
            left: 9.25%;  /* 988 / 10677 */
            
            /* Tweak this width until the NippleJS base matches your background base */
            width: 22%; 
            aspect-ratio: 1 / 1; /* Keeps the touch zone perfectly square */
            pointer-events: auto; 
        }
        
        .nipple .back {
            background: url('joystick_base.png') center/contain no-repeat !important;
            background-color: transparent !important;
            border: none !important;
            opacity: 1 !important; 
        }
        .nipple .front {
            background: url('joystick_knob.png') center/contain no-repeat !important;
            background-color: transparent !important;
            border: none !important;
            opacity: 1 !important;
        }

        /* --- ACTION BUTTONS ZONE --- */
        #action-pad {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; 
        }

        .action-btn {
            position: absolute;
            /* Tweak this ONE width to scale all 4 buttons up or down simultaneously */
            width: 8%; 
            height: auto;
            pointer-events: auto; 
            transition: opacity 0.05s ease; 
            /* NOTICE: We removed the translate(-50%, -50%) here! */
        }

        /* --- EXACT PHOTOSHOP PERCENTAGES --- */
        #btn-triangle { top: 13.41%; left: 74.20%; }
        #btn-square   { top: 24.37%; left: 65.77%; }
        #btn-circle   { top: 23.71%; left: 83.44%; }
        #btn-x        { top: 34.48%; left: 74.73%; }

        /* --- MENU BUTTONS --- */
        .menu-btn {
            position: absolute;
            /* Tweak this width until they fit perfectly in the slots */
            width: 5%; 
            height: auto;
            pointer-events: auto; 
            transition: opacity 0.05s ease; 
        }

        #btn-select { top: 37.28%; left: 40.54%; }
        #btn-start  { top: 36.66%; left: 52.87%; }

        @media (orientation: landscape) and (min-width: 600px) {
            #controller-overlay {
                width: 38vw;
                max-width: 320px;
            }
        }

        @media (min-width: 1024px) {
            #controller-overlay {
                width: 28vw;
                max-width: 280px;
            }
        }

        /* (The old #mobile-jump circle was styled here for an element that no
           longer exists in the markup — X on the pad does the jumping.) */

    

    </style>
    <script>
    (function(){
    const LOG_KEY = 'mq_crashlog';
    const HEARTBEAT_KEY = 'mq_heartbeat';

    function readLog(){
        try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); }
        catch(e){ return []; }
    }
    function writeLog(arr){
        try { localStorage.setItem(LOG_KEY, JSON.stringify(arr.slice(-80))); } catch(e){}
    }
    function log(type, data){
        const arr = readLog();
        arr.push({ t: Date.now(), iso: new Date().toISOString(), type, data });
        writeLog(arr);
    }
    // Let game.js push renderer stats into the same crash log, so the on-screen
    // badge shows GPU texture/geometry counts from the run that died.
    window.mqLog = log;

    // ---- Detect "silent reload" on startup ----
    // If a heartbeat was written less than 5s ago AND we're freshly executing top-level code,
    // the tab was almost certainly killed and reloaded by iOS.
    try {
        const lastBeat = parseInt(localStorage.getItem(HEARTBEAT_KEY) || '0', 10);
        const gap = Date.now() - lastBeat;
        if (lastBeat && gap < 8000) {
        log('SILENT_RELOAD_DETECTED', {
            msSinceLastHeartbeat: gap,
            memory: performance.memory ? {
            used: performance.memory.usedJSHeapSize,
            total: performance.memory.totalJSHeapSize,
            limit: performance.memory.jsHeapSizeLimit
            } : 'unavailable'
        });
        } else if (lastBeat) {
        log('NORMAL_LOAD', { msSinceLastHeartbeat: gap });
        } else {
        log('FIRST_LOAD', {});
        }
    } catch(e){}

    // ---- Heartbeat: pulse every 1s so we know the last moment we were alive ----
    setInterval(() => {
        try { localStorage.setItem(HEARTBEAT_KEY, String(Date.now())); } catch(e){}
    }, 1000);

    // ---- JS error catchers ----
    window.addEventListener('error', (e) => {
        log('JS_ERROR', {
        msg: e.message,
        file: e.filename,
        line: e.lineno,
        col: e.colno,
        stack: e.error && e.error.stack ? String(e.error.stack).slice(0, 500) : null
        });
    });
    window.addEventListener('unhandledrejection', (e) => {
        log('UNHANDLED_REJECTION', {
        reason: (e.reason && e.reason.message) || String(e.reason).slice(0, 500)
        });
    });

    // ---- Lifecycle events ----
    window.addEventListener('pagehide', (e) => {
        log('PAGEHIDE', { persisted: e.persisted });
    });
    window.addEventListener('beforeunload', () => {
        log('BEFOREUNLOAD', {});
    });
    document.addEventListener('visibilitychange', () => {
        log('VISIBILITY', { state: document.visibilityState });
    });

    // ---- WebGL context loss (the strongest single signal of GPU memory pressure on iOS) ----
    // We can't attach this until the canvas exists, so poll briefly.
    const tryAttachGL = () => {
        const c = document.querySelector('canvas');
        if (!c) return false;
        c.addEventListener('webglcontextlost', (e) => {
        log('WEBGL_CONTEXT_LOST', { defaultPrevented: e.defaultPrevented });
        }, false);
        c.addEventListener('webglcontextrestored', () => {
        log('WEBGL_CONTEXT_RESTORED', {});
        }, false);
        return true;
    };
    let glTries = 0;
    const glInterval = setInterval(() => {
        if (tryAttachGL() || ++glTries > 50) clearInterval(glInterval);
    }, 200);

    // ---- Periodic memory sample (Safari does NOT expose performance.memory, but log if available) ----
    setInterval(() => {
        if (performance.memory) {
        log('MEM', {
            used: performance.memory.usedJSHeapSize,
            total: performance.memory.totalJSHeapSize
        });
        }
    }, 5000);

    // ---- Viewer for the previous session's log ----
    // No longer a permanent on-screen badge — it sat on top of the HUD. The log
    // is still captured exactly as before; call window.mqShowCrashLog() from the
    // console (or window.mqClearCrashLog()) to read it back.
    function buildViewer(){
        const arr = readLog();
        if (!arr.length) return;
        const panel = document.createElement('pre');
        panel.style.cssText = `
        position:fixed; top:36px; right:8px; z-index:99999;
        background:rgba(0,0,0,0.92); color:#0f0;
        font:10px/1.3 monospace; padding:8px;
        max-width:90vw; max-height:70vh; overflow:auto;
        border:1px solid #0f0; border-radius:4px;
        display:none; white-space:pre-wrap; pointer-events:auto;
        `;
        panel.textContent = arr.map(e =>
        e.iso.slice(11,19) + ' ' + e.type + ' ' + JSON.stringify(e.data)
        ).join('\n');
        // Tap the panel itself to dismiss it once it has been opened.
        panel.addEventListener('click', () => { panel.style.display = 'none'; });

        document.addEventListener('DOMContentLoaded', () => {
        document.body.appendChild(panel);
        });

        window.mqShowCrashLog  = () => { panel.style.display = 'block'; return arr.length; };
        window.mqClearCrashLog = () => { localStorage.removeItem(LOG_KEY); panel.remove(); };
    }
    buildViewer();
    })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</head>
<body>
    
    <div id="hud">
        <div class="hud-group">
            <span id="hud-score">00</span>
            <span id="hud-armor">&#9670;&nbsp;0</span>
            <span id="hud-stars"></span>
        </div>

        <div class="hud-group center">
            <span id="hud-timer">3:00</span>
        </div>

        <div class="hud-group right">
            <div id="hud-health"><i id="hud-health-fill"></i></div>
            <div class="hud-sep" id="hud-status-sep" style="display:none;"></div>
            <span class="hud-pip" id="hud-pip-bike"></span>
            <span class="hud-pip" id="hud-pip-drink"></span>
        </div>
    </div>

    <div id="game-over">SHIFT ENDED</div>

    <div id="zone-warning">⚠️ LEAVING SAFE ZONE ⚠️</div>

    <div id="controller-overlay">
        
        <div id="zone_joystick"></div>

        <div id="action-pad">
            <img src="triangleBTN.png" id="btn-triangle" class="action-btn">
            <img src="squareBTN.png" id="btn-square" class="action-btn">
            <img src="circleBTN.png" id="btn-circle" class="action-btn">
            <img src="xBTN.png" id="btn-x" class="action-btn">
            
            <img src="selectBTN.png" id="btn-select" class="menu-btn">
            <img src="startBTN.png" id="btn-start" class="menu-btn">
        </div>
    </div>
    
    <div id="pause-screen">
        <div style="margin-bottom: 30px;">PAUSED</div>

        <button class="debug-btn" onclick="window.togglePause()">RESUME GAME</button>
        
        <button class="debug-btn" onclick="window.returnToMenu()">MAIN MENU</button>
        <button class="debug-btn" onclick="window.debugSpawn('bike')">SPAWN BIKE</button>
        <button class="debug-btn" onclick="window.debugSpawn('drink')">SPAWN DRINK</button>
        
        <button class="debug-btn" onclick="window.debugSpawn('armor_tee')">SPAWN T-SHIRT</button>
        <button class="debug-btn" onclick="window.debugSpawn('armor_belt')">SPAWN BELT</button>
        
        <button class="debug-btn" onclick="window.spawnPolice()">SPAWN POLICE</button>
        <button class="debug-btn" onclick="window.toggleStats()">PERF STATS (I)</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.7.0/build/index.module.js"
            }
        }
    </script>
    <script type="module" src="./game.js"></script>
</body>
</html>
